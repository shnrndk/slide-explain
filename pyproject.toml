[project]
name = "slide-explain"
version = "0.2.0"
description = "A durable local notebook for learning from slides"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "pypdf==5.5.0",
  "pypdfium2==4.30.0",
  "Pillow==11.2.1",
  "openai==2.26.0",
  "python-multipart==0.0.20",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller==6.22.3",
    "pywebview==6.2.1",
]
[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
